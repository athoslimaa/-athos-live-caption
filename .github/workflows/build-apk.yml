name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AthosLiveCaption-MVP-0.3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AthosLiveCaption-MVP-0.3
          path: AthosLiveCaption-MVP-0.3.apk
          if-no-files-found: error
          retention-days: 30
